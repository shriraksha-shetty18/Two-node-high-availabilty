
# /etc/keepalived/keepalived.conf  (on the MASTER node)
#
# Higher priority than the slave, so this node holds the VIP whenever
# it's alive. `nopreempt` means: if this node comes back after a
# failure, it does NOT automatically snatch the VIP back from the slave.
# That's deliberate — an automatic snap-back could yank the VIP away
# mid-request and risks the Manager starting from a stale local DB
# before it's pulled the slave's more recent state. Fail back manually
# once you've confirmed the recovered master's DB is caught up (see
# README "Failing back to master").

vrrp_instance VI_1 {
    state MASTER
    interface enp0s8                   
    virtual_router_id 51            # must match on both nodes, 
    priority 150                    # higher than the slave's 100
    advert_int 1                    # VRRP advertisement every 1s
    nopreempt

    authentication {
        auth_type PASS
        auth_pass 1234  #  must match on both nodes
    }

    virtual_ipaddress {
        192.168.195.100           # <-- the VIP; point   frontend/Manager URL  
    }

    notify_master "/etc/keepalived/notify_master.sh"
    notify_backup "/etc/keepalived/notify_backup.sh"
    notify_fault  "/etc/keepalived/notify_fault.sh"
}
