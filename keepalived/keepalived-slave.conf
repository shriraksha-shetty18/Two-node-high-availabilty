# /etc/keepalived/keepalived.conf  (on the SLAVE node)
#
# Lower priority — stays BACKUP (and doesn't run the Manager) as long as
# the master is alive. Takes the VIP, and starts the Manager locally,
# the moment master's VRRP advertisements stop arriving.

vrrp_instance VI_1 {
    state BACKUP
    interface ensp0s8                 # <-- change to your actual NIC
    virtual_router_id 51            # must match the master's config exactly
    priority 100                    # lower than the master's 150
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass 1234   # must match the master's config exactly
    }

    virtual_ipaddress {
        192.168.195.100           # same VIP as the master's config
    }

    notify_master "/etc/keepalived/notify_master.sh"
    notify_backup "/etc/keepalived/notify_backup.sh"
    notify_fault  "/etc/keepalived/notify_fault.sh"
}
